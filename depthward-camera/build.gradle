plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.depthward'
version = '1.0.38'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            args '--mixin.config', 'depthward_camera.mixins.json'
            mods { depthward_camera { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    compileOnly 'org.spongepowered:mixin:0.8.5'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest { attributes 'MixinConfigs': 'depthward_camera.mixins.json' }
    finalizedBy 'reobfJar'
}
